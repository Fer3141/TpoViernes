<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        #dashboard-screen { display: none; }
        #loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 h-screen">

    <div id="login-screen" class="flex items-center justify-center h-full">
        <form id="login-form" class="p-8 bg-white rounded-lg shadow-xl w-96">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">VidaSana (Profesional)</h2>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="username">Usuario (Médico)</label>
                <input id="username" type="text" value="agomez" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Contraseña</label>
                <input id="password" type="password" value="pass123" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3">
            </div>
            <div id="login-error" class="text-red-500 text-sm mb-4 hidden"></div>
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">Ingresar</button>
        </form>
    </div>

    <div id="dashboard-screen" class="h-screen flex-col bg-gray-100">
        <header class="flex items-center justify-between p-4 bg-white border-b shadow-sm">
            <h1 class="text-2xl font-bold text-sky-700">Dashboard Profesional</h1>
            <div class="flex items-center space-x-4">
                <span class="text-gray-700 hidden sm:block">Hola, <span id="user-name" class="font-semibold"></span></span>
                <button id="logout-button" class="text-gray-500 hover:text-red-600"><i data-lucide="log-out" class="w-5 h-5"></i></button>
            </div>
        </header>

        <main class="flex-1 flex flex-col p-6 overflow-hidden">
            <div class="mb-4">
                <label for="paciente-select" class="block text-sm font-medium text-gray-700 mb-1">Seleccionar Paciente</label>
                <select id="paciente-select" class="w-full max-w-xs p-2 border rounded-md shadow-sm"></select>
            </div>
            
            <div class="flex-1 p-6 overflow-auto bg-white rounded-lg shadow-lg">
                <nav class="flex space-x-2 mb-6 border-b border-gray-200">
                    <button data-tab="perfil" class="tab-button flex items-center space-x-2 px-4 py-2 text-sm font-medium rounded-t-md border-b-2 border-blue-500 text-blue-600"><i data-lucide="user" class="w-4 h-4"></i><span>Perfil</span></button>
                    <button data-tab="visitas" class="tab-button flex items-center space-x-2 px-4 py-2 text-sm font-medium rounded-t-md text-gray-500 hover:text-gray-700"><i data-lucide="clipboard" class="w-4 h-4"></i><span>Visitas</span></button>
                    <button data-tab="habitos" class="tab-button flex items-center space-x-2 px-4 py-2 text-sm font-medium rounded-t-md text-gray-500 hover:text-gray-700"><i data-lucide="line-chart" class="w-4 h-4"></i><span>Hábitos</span></button>
                    <button data-tab="red" class="tab-button flex items-center space-x-2 px-4 py-2 text-sm font-medium rounded-t-md text-gray-500 hover:text-gray-700"><i data-lucide="network" class="w-4 h-4"></i><span>Red y Riesgos</span></button>
                </nav>

                <div id="loading-spinner" class="mx-auto hidden"></div>
                <div id="content-error" class="text-red-500 hidden"></div>

                <div id="tab-content">
                    <div id="perfil-content" class="tab-pane"></div>
                    <div id="visitas-content" class="tab-pane hidden"></div>
                    <div id="habitos-content" class="tab-pane hidden"></div>
                    <div id="red-content" class="tab-pane hidden"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let currentToken = null;
        let currentUser = null; 

        // --- Selectores ---
        const loginScreen = document.getElementById('login-screen');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const userName = document.getElementById('user-name');
        const logoutButton = document.getElementById('logout-button');
        const pacienteSelect = document.getElementById('paciente-select');
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabPanes = document.querySelectorAll('.tab-pane');
        const loadingSpinner = document.getElementById('loading-spinner');
        const contentError = document.getElementById('content-error');

        // --- Login (Actualizado) ---
        async function handleLogin(e) {
            e.preventDefault();
            loginError.classList.add('hidden');
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                // 1. Pedir el token
                const res = await fetch(`${API_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData,
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail); }
                
                const tokenData = await res.json();
                currentToken = tokenData.access_token;
                localStorage.setItem('vidasana_token', currentToken);
                
                // 2. Usar el token para pedir info del usuario (¡NUEVO!)
                const userRes = await fetch(`${API_URL}/usuarios/me`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                if (!userRes.ok) throw new Error('No se pudo obtener el perfil del usuario');
                
                currentUser = await userRes.json();

                // 3. Validar que sea Médico
                if (!currentUser.roles.includes("MEDICO")) {
                    throw new Error("Acceso denegado. Se requiere rol de MÉDICO.");
                }

                await showDashboard();

            } catch (error) {
                console.error("Error en el login:", error);
                loginError.textContent = error.message;
                loginError.classList.remove('hidden');
                handleLogout(); // Limpiar token si falla
            }
        }
        
        async function showDashboard() {
            userName.textContent = currentUser?.pii?.nombre || currentUser?.auth?.username;
            loginScreen.style.display = 'none';
            dashboardScreen.style.display = 'flex';
            
            // Cargar pacientes (hardcodeado para demo, idealmente vendría de la API)
            const pacientes = [
                { id: 'usr-001', nombre: 'Juan Lopez' },
                { id: 'usr-002', nombre: 'Maria Lopez' },
            ];
            pacienteSelect.innerHTML = pacientes.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
            
            await fetchDataForPatient(pacientes[0].id);
        }

        function handleLogout() {
            localStorage.removeItem('vidasana_token');
            currentToken = null; currentUser = null;
            loginScreen.style.display = 'flex';
            dashboardScreen.style.display = 'none';
        }

        // --- Carga de Datos (Req 6) ---
        async function fetchDataForPatient(pacienteId) {
            if (!pacienteId) return;
            loadingSpinner.classList.remove('hidden');
            contentError.classList.add('hidden');
            tabPanes.forEach(pane => pane.innerHTML = ''); 

            try {
                const fetchApi = async (url) => {
                    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${currentToken}` } });
                    if (!res.ok) { const err = await res.json(); throw new Error(err.detail); }
                    return res.json();
                };
                
                const [perfil, visitas, habitos, red, riesgos] = await Promise.all([
                    fetchApi(`${API_URL}/paciente/${pacienteId}/perfil`),
                    fetchApi(`${API_URL}/paciente/${pacienteId}/visitas`),
                    fetchApi(`${API_URL}/paciente/${pacienteId}/habitos`),
                    fetchApi(`${API_URL}/paciente/${pacienteId}/red_cuidado`),
                    fetchApi(`${API_URL}/paciente/${pacienteId}/familiares_con_riesgo?riesgo=diabetes`) // Mantenemos diabetes como default
                ]);

                renderPerfil(perfil);
                renderVisitas(visitas);
                renderHabitos(habitos);
                renderRed(red, riesgos);
                
            } catch (err) {
                console.error("Error fetching data:", err);
                contentError.textContent = `Error: ${err.message}`;
                contentError.classList.remove('hidden');
            } finally {
                loadingSpinner.classList.add('hidden');
                lucide.createIcons();
            }
        }
        
        // --- Render Perfil (Req 1) ---
        function renderPerfil(perfil) {
            const p = perfil.paciente || {};
            const pii = perfil.pii || {};
            document.getElementById('perfil-content').innerHTML = `
                <h3 class="text-xl font-semibold text-gray-800">Perfil del Paciente</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div class="bg-gray-50 p-4 rounded-lg border"><h4 class="text-sm font-medium text-gray-500">Nombre</h4><p class="text-lg font-semibold">${pii.nombre || 'N/A'}</p></div>
                    <div class="bg-gray-50 p-4 rounded-lg border"><h4 class="text-sm font-medium text-gray-500">DNI</h4><p class="text-lg font-semibold">${pii.dni || 'N/A'}</p></div>
                    <div class="bg-gray-50 p-4 rounded-lg border col-span-1 md:col-span-2">
                        <h4 class="text-sm font-medium text-gray-500">Obra Social</h4>
                        <div class="flex items-center space-x-2 mt-2">
                            <input id="input-obra-social" type="text" value="${p.obra_social || ''}" class="shadow-sm border rounded w-full py-2 px-3">
                            <button id="btn-guardar-os" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Guardar</button>
                        </div>
                        <div id="os-save-status" class="text-sm mt-2"></div>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg border"><h4 class="text-sm font-medium text-gray-500">Alergias</h4><p class="text-lg font-semibold">${p.clinico?.alergias?.join(', ') || 'Ninguna'}</p></div>
                </div>
            `;
            document.getElementById('btn-guardar-os').addEventListener('click', () => handleGuardarOS(perfil._id));
        }
        
        // --- Render Visitas (Req 1) ---
        function renderVisitas(visitas) {
            let html = '<h3 class="text-xl font-semibold text-gray-800">Historia Clínica</h3>';
            if (visitas.length === 0) {
                html += '<p>No hay visitas registradas.</p>';
            } else {
                html += `<table class="min-w-full divide-y divide-gray-200 mt-4 border rounded-lg">
                        <thead class="bg-gray-50"><tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fecha</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Especialidad</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Diagnóstico</th>
                        </tr></thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${visitas.map(v => `
                                <tr>
                                    <td class="px-6 py-4">${new Date(v.ts.$date).toLocaleDateString()}</td>
                                    <td class="px-6 py-4">${v.especialidad}</td>
                                    <td class="px-6 py-4">${v.diagnosticos?.join(', ') || 'N/A'}</td>
                                </tr>
                            `).join('')}
                        </tbody></table>`;
            }
            document.getElementById('visitas-content').innerHTML = html;
        }

        // --- Render Hábitos (Req 2) ---
        function renderHabitos(habitos) {
             let html = '<h3 class="text-xl font-semibold text-gray-800">Seguimiento de Hábitos</h3>';
            if (habitos.length === 0) {
                html += '<p>No hay hábitos registrados.</p>';
            } else {
                 html += `<table class="min-w-full divide-y divide-gray-200 mt-4 border rounded-lg">
                        <thead class="bg-gray-50"><tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fecha</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tipo</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Valor</th>
                        </tr></thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${habitos.map(h => `
                                <tr>
                                    <td class="px-6 py-4">${new Date(h.ts.$date).toLocaleString()}</td>
                                    <td class="px-6 py-4">${h.tipo}</td>
                                    <td class="px-6 py-4">${h.valor} ${h.notas ? `(${h.notas})` : ''}</td>
                                </tr>
                            `).join('')}
                        </tbody></table>`;
            }
            document.getElementById('habitos-content').innerHTML = html;
        }

        // --- Render Red y Riesgos (Req 3 y 5) (¡ACTUALIZADO!) ---
        function renderRed(red, riesgos) {
            const redHtml = (red?.medicos_tratantes.length > 0)
                ? `<ul class="list-disc list-inside">${red.medicos_tratantes.map(m => `<li>${m.nombre_medico} (${m.rol})</li>`).join('')}</ul>`
                : 'Sin datos de red.';
            
            const riesgoHtml = (riesgos?.familiares_con_riesgo.length > 0)
                ? `<ul class="list-disc list-inside">${riesgos.familiares_con_riesgo.map(f => `<li class="text-red-600">${f.nombre_familiar}</li>`).join('')}</ul>`
                : 'Sin riesgos familiares detectados.';
            
            document.getElementById('red-content').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-6">
                        <div>
                            <h3 class="text-xl font-semibold">Red de Cuidado</h3>
                            <div class="p-4 bg-gray-50 rounded-lg border mt-2">
                                <h4 class="font-semibold mb-2">Médicos Tratantes (Neo4j):</h4>
                                ${redHtml}
                            </div>
                        </div>
                        <div>
                            <h3 class="text-xl font-semibold">Riesgos Familiares</h3>
                            <div class="p-4 bg-red-50 border border-red-200 rounded-lg mt-2">
                                <h4 class="font-semibold text-red-700 mb-2">Riesgo 'diabetes' en familiares:</h4>
                                ${riesgoHtml}
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                         <div>
                            <h3 class="text-xl font-semibold">Cálculo de Riesgo (Mongo)</h3>
                            <div class="p-4 bg-blue-50 border border-blue-200 rounded-lg mt-2">
                                <p class="text-sm text-gray-600 mb-4">Selecciona un riesgo para calcularlo basado en hábitos y diagnósticos.</p>
                                <select id="select-riesgo-tipo" class="mb-2 w-full p-2 border rounded-md">
                                    <option value="diabetes">Diabetes</option>
                                    <option value="hipertension">Hipertensión</option>
                                </select>
                                <button id="btn-calcular-riesgo" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">Calcular Riesgo (POST)</button>
                                <div id="riesgo-calculado-resultado" class="mt-4 space-y-3"></div>
                            </div>
                         </div>
                         <div>
                            <h3 class="text-xl font-semibold">Asignación de Riesgo (Neo4j)</h3>
                            <div class="p-4 bg-gray-50 border rounded-lg mt-2">
                                <p class="text-sm text-gray-600 mb-4">Asigna un diagnóstico permanente a la red del paciente (ej: diabetes, celiaquia).</p>
                                <div class="flex space-x-2">
                                    <input id="input-asignar-riesgo" type="text" placeholder="Ej: diabetes" class="w-full p-2 border rounded-md">
                                    <button id="btn-asignar-riesgo" class="bg-gray-600 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded">Asignar</button>
                                </div>
                                <div id="asignar-riesgo-status" class="mt-2 text-sm"></div>
                            </div>
                         </div>
                    </div>
                </div>
            `;
            
            document.getElementById('btn-calcular-riesgo').addEventListener('click', () => handleCalcularRiesgo(red.pacienteId));
            document.getElementById('btn-asignar-riesgo').addEventListener('click', () => handleAsignarRiesgo(red.pacienteId));
        }
        
        // --- Handlers (Actualizados) ---
        async function handleGuardarOS(pacienteId) {
            const statusDiv = document.getElementById('os-save-status');
            const input = document.getElementById('input-obra-social');
            statusDiv.textContent = 'Guardando...';
            try {
                const res = await fetch(`${API_URL}/paciente/${pacienteId}/perfil`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "obra_social": input.value })
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail); }
                statusDiv.textContent = '¡Guardado con éxito!';
                statusDiv.className = 'text-sm mt-2 text-green-600';
            } catch (error) {
                statusDiv.textContent = `Error: ${error.message}`;
                statusDiv.className = 'text-sm mt-2 text-red-600';
            }
        }

        async function handleCalcularRiesgo(pacienteId) {
            const resultadoDiv = document.getElementById('riesgo-calculado-resultado');
            const boton = document.getElementById('btn-calcular-riesgo');
            const riesgoTipo = document.getElementById('select-riesgo-tipo').value;
            
            const tempStatusDiv = document.createElement('div');
            tempStatusDiv.className = 'text-gray-500';
            tempStatusDiv.textContent = `Calculando ${riesgoTipo}...`;
            resultadoDiv.prepend(tempStatusDiv);
            boton.disabled = true;

            try {
                const res = await fetch(`${API_URL}/paciente/${pacienteId}/calcular_riesgo?riesgo=${riesgoTipo}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail); }
                const data = await res.json();
                
                let color = {"bajo": "text-green-700", "medio": "text-yellow-700", "alto": "text-red-700"}[data.score] || "text-gray-700";
                tempStatusDiv.className = 'p-3 border rounded-md bg-gray-50';
                tempStatusDiv.innerHTML = `
                    <p class="font-semibold">Resultado: ${data.tipo.charAt(0).toUpperCase() + data.tipo.slice(1)}</p>
                    <p class="${color}"><strong>Score:</strong> ${data.score.toUpperCase()}</p>
                    <p class="text-sm text-gray-600"><strong>Motivo:</strong> ${data.motivo}</p>
                    <p class="text-xs text-gray-400 mt-2">Calculado: ${new Date(data.calculado_en).toLocaleString()}</p>
                `;
            } catch (error) {
                tempStatusDiv.className = 'p-3 border rounded-md bg-red-50 text-red-700';
                tempStatusDiv.innerHTML = `<p><strong>Error al calcular ${riesgoTipo}:</strong> ${error.message}</p>`;
            } finally {
                boton.disabled = false;
            }
        }

        // --- (¡NUEVO!) Handler para Asignar Riesgo (Req 5) ---
        async function handleAsignarRiesgo(pacienteId) {
            const statusDiv = document.getElementById('asignar-riesgo-status');
            const input = document.getElementById('input-asignar-riesgo');
            const boton = document.getElementById('btn-asignar-riesgo');
            const tipoRiesgo = input.value.trim().toLowerCase();

            if (!tipoRiesgo) {
                statusDiv.textContent = 'Debe ingresar un tipo de riesgo.';
                statusDiv.className = 'mt-2 text-sm text-red-600';
                return;
            }
            
            statusDiv.textContent = 'Asignando...';
            statusDiv.className = 'mt-2 text-sm text-gray-500';
            boton.disabled = true;

            try {
                const res = await fetch(`${API_URL}/paciente/${pacienteId}/asignar_riesgo`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "tipo": tipoRiesgo })
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail); }
                
                statusDiv.textContent = `Riesgo '${tipoRiesgo}' asignado con éxito.`;
                statusDiv.className = 'mt-2 text-sm text-green-600';
                input.value = '';
            } catch (error) {
                statusDiv.innerHTML = `<p><strong>Error:</strong> ${error.message}</p>`;
                statusDiv.className = 'mt-2 text-sm text-red-600';
            } finally {
                boton.disabled = false;
            }
        }

        // --- Event Listeners ---
        loginForm.addEventListener('submit', handleLogin);
        logoutButton.addEventListener('click', handleLogout);
        pacienteSelect.addEventListener('change', (e) => fetchDataForPatient(e.target.value));
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetTab = button.dataset.tab;
                tabPanes.forEach(pane => pane.classList.add('hidden'));
                tabButtons.forEach(btn => {
                    btn.classList.remove('border-blue-500', 'text-blue-600');
                    btn.classList.add('text-gray-500');
                });
                document.getElementById(`${targetTab}-content`).classList.remove('hidden');
                button.classList.add('border-blue-500', 'text-blue-600');
            });
        });

        // --- Init ---
        function initApp() {
            const storedToken = localStorage.getItem('vidasana_token');
            if (storedToken) {
                // (No auto-login, es mejor que el médico ponga sus credenciales siempre)
                // currentToken = storedToken;
                // showDashboard(); 
            }
            lucide.createIcons();
        }
        initApp();
    </script>
</body>
</html>
